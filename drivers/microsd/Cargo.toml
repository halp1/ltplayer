[package]
name = "microsd"
version = "0.1.0"
edition = "2024"

[dependencies]
aligned = "0.4.3"
block-device-driver = "0.2.0"
sdio = "0.5.3"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-stm32 = { version = "0.6.0", features = ["stm32u575zi", "defmt", "time-driver-any"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
defmt = { version = "1.0.1", optional = true }
exfat-slim = "0.7.0"

[lib]
name = "microsd"
path = "src/lib.rs"
test = false
bench = false
