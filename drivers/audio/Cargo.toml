[package]
name = "audio"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-stm32 = { version = "0.6.0", features = ["stm32u575zi", "defmt", "time-driver-any"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
defmt = { version = "1.0.1", optional = true }

[lib]
name = "audio"
path = "src/lib.rs"
test = false
bench = false
