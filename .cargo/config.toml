[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip STM32U575ZITxQ --connect-under-reset"
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]

[env]
DEFMT_LOG = "info"

[target.aarch64-apple-darwin]
rustflags = ["-L", "/opt/homebrew/lib"]

[alias]
flash-board = "run --release --locked --bin ltplayer"
eyespi = "run --release --locked --example eyespi"
preview = "run --manifest-path simulator/Cargo.toml --target aarch64-apple-darwin"
